name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build (rewrite image URLs to S3)
        env:
          ASSETS_BASE_URL: ${{ secrets.ASSETS_BASE_URL }}
        run: |
          # Fallback to .env if secret not set
          node -e "
            const fs=require('fs');
            const envPath='.env';
            if (!process.env.ASSETS_BASE_URL && fs.existsSync(envPath)) {
              const text=fs.readFileSync(envPath,'utf8');
              for (const line of text.split('\n')) {
                const t=line.trim(); if (!t||t.startsWith('#')) continue;
                const i=t.indexOf('='); if (i===-1) continue;
                const k=t.slice(0,i).trim(), v=t.slice(i+1).trim().replace(/^\"|\"$/g,'').replace(/^\'|\'$/g,'');
                if (k==='ASSETS_BASE_URL') process.env.ASSETS_BASE_URL = v;
              }
            }
            if (!process.env.ASSETS_BASE_URL) throw new Error('ASSETS_BASE_URL missing');
          " && node scripts/build.js

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
