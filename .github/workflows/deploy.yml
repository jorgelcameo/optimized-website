name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build (rewrite image URLs to S3)
        env:
          ASSETS_BASE_URL: ${{ secrets.ASSETS_BASE_URL }}
          QUOTE_API_URL: ${{ vars.QUOTE_API_URL }}
        run: |
          # Fallback to .env if secret not set
          node -e "
            const fs=require('fs');
            const envPath='.env';
            if (!process.env.ASSETS_BASE_URL && fs.existsSync(envPath)) {
              const text=fs.readFileSync(envPath,'utf8');
              for (const line of text.split('\n')) {
                const t=line.trim(); if (!t||t.startsWith('#')) continue;
                const i=t.indexOf('='); if (i===-1) continue;
                const k=t.slice(0,i).trim(), v=t.slice(i+1).trim().replace(/^\"|\"$/g,'').replace(/^\'|\'$/g,'');
                if (k==='ASSETS_BASE_URL') process.env.ASSETS_BASE_URL = v;
              }
            }
            if (!process.env.ASSETS_BASE_URL) throw new Error('ASSETS_BASE_URL missing');
            if (!process.env.QUOTE_API_URL) throw new Error('QUOTE_API_URL missing');
          " && node scripts/build.js

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  upload-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.S3_REGION || 'us-east-2' }}

      - name: Upload source images and audio to S3
        run: npm run deploy:assets
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET || 'max-payne-assets' }}
          S3_REGION: ${{ vars.S3_REGION || 'us-east-2' }}
          S3_KEY_PREFIX: ${{ vars.S3_KEY_PREFIX || 'assets/images' }}
          S3_AUDIO_KEY_PREFIX: ${{ vars.S3_AUDIO_KEY_PREFIX || 'assets/audio' }}

  deploy:
    needs: [build, upload-assets]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
